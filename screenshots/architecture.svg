<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" font-family="'Courier New',monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4a7c9e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="740" fill="#020c1a"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" fill="#60a5fa" font-size="18" font-weight="bold" letter-spacing="4">INTEL GLOBE — SYSTEM ARCHITECTURE</text>
  <text x="600" y="54" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="2">Open-Source Intelligence Aggregation Platform — All Public APIs, No Authentication Required</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1e3a5f" stroke-width="1"/>

  <!-- ── LAYER 1: DATA SOURCES ── -->
  <rect x="30" y="78" width="1140" height="150" rx="4" fill="#020e1f" stroke="#1e40af" stroke-width="1.5"/>
  <text x="46" y="96" fill="#60a5fa" font-size="11" font-weight="bold" letter-spacing="3">PUBLIC DATA SOURCES</text>
  <text x="46" y="109" fill="#334155" font-size="9" letter-spacing="2">OPEN APIS — NO AUTHENTICATION — NO API KEYS — FULLY PUBLIC</text>

  <!-- Source boxes -->
  <!-- GDELT -->
  <rect x="46" y="118" width="168" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="130" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">GDELT PROJECT</text>
  <text x="130" y="151" text-anchor="middle" fill="#64748b" font-size="8">Real-time global event stream</text>
  <text x="130" y="163" text-anchor="middle" fill="#64748b" font-size="8">300+ languages monitored</text>
  <text x="130" y="175" text-anchor="middle" fill="#64748b" font-size="8">3M+ events/day indexed</text>
  <text x="130" y="187" text-anchor="middle" fill="#22c55e" font-size="8">api.gdeltproject.org/v2</text>
  <text x="130" y="203" text-anchor="middle" fill="#1e40af" font-size="8">PRIMARY FEED</text>

  <!-- ReliefWeb -->
  <rect x="226" y="118" width="168" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="310" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">RELIEFWEB / UN OCHA</text>
  <text x="310" y="151" text-anchor="middle" fill="#64748b" font-size="8">UN humanitarian reports</text>
  <text x="310" y="163" text-anchor="middle" fill="#64748b" font-size="8">Crisis situation updates</text>
  <text x="310" y="175" text-anchor="middle" fill="#64748b" font-size="8">Disaster response intel</text>
  <text x="310" y="187" text-anchor="middle" fill="#22c55e" font-size="8">api.reliefweb.int/v1</text>
  <text x="310" y="203" text-anchor="middle" fill="#0ea5e9" font-size="8">HUMANITARIAN</text>

  <!-- USGS -->
  <rect x="406" y="118" width="168" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="490" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">USGS EARTHQUAKE API</text>
  <text x="490" y="151" text-anchor="middle" fill="#64748b" font-size="8">Live seismic event feed</text>
  <text x="490" y="163" text-anchor="middle" fill="#64748b" font-size="8">Global magnitude + depth</text>
  <text x="490" y="175" text-anchor="middle" fill="#64748b" font-size="8">Real-time sensor network</text>
  <text x="490" y="187" text-anchor="middle" fill="#22c55e" font-size="8">earthquake.usgs.gov/fdsnws</text>
  <text x="490" y="203" text-anchor="middle" fill="#f59e0b" font-size="8">GEOSPATIAL</text>

  <!-- NASA FIRMS -->
  <rect x="586" y="118" width="168" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="670" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">NASA FIRMS</text>
  <text x="670" y="151" text-anchor="middle" fill="#64748b" font-size="8">Satellite fire detection</text>
  <text x="670" y="163" text-anchor="middle" fill="#64748b" font-size="8">Active hotspot mapping</text>
  <text x="670" y="175" text-anchor="middle" fill="#64748b" font-size="8">MODIS + VIIRS sensors</text>
  <text x="670" y="187" text-anchor="middle" fill="#22c55e" font-size="8">firms.modaps.eosdis.nasa.gov</text>
  <text x="670" y="203" text-anchor="middle" fill="#ef4444" font-size="8">SATELLITE</text>

  <!-- AIS -->
  <rect x="766" y="118" width="168" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="850" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">AIS VESSEL DATA</text>
  <text x="850" y="151" text-anchor="middle" fill="#64748b" font-size="8">Maritime traffic positions</text>
  <text x="850" y="163" text-anchor="middle" fill="#64748b" font-size="8">Ship routing + flagging</text>
  <text x="850" y="175" text-anchor="middle" fill="#64748b" font-size="8">Anomaly detection</text>
  <text x="850" y="187" text-anchor="middle" fill="#22c55e" font-size="8">Public AIS broadcast feed</text>
  <text x="850" y="203" text-anchor="middle" fill="#06b6d4" font-size="8">MARITIME</text>

  <!-- World Bank -->
  <rect x="946" y="118" width="198" height="96" rx="3" fill="#0a1628" stroke="#1e40af" stroke-width="1"/>
  <text x="1045" y="136" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">WORLD BANK API</text>
  <text x="1045" y="151" text-anchor="middle" fill="#64748b" font-size="8">Economic indicators</text>
  <text x="1045" y="163" text-anchor="middle" fill="#64748b" font-size="8">GDP, inflation, debt</text>
