  <text x="1045" y="187" text-anchor="middle" fill="#22c55e" font-size="8">api.worldbank.org/v2</text>
  <text x="1045" y="203" text-anchor="middle" fill="#a78bfa" font-size="8">ECONOMIC</text>

  <!-- Arrows: Sources → Ingestion -->
  <line x1="130" y1="214" x2="130" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="214" x2="310" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="214" x2="490" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="214" x2="670" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="214" x2="850" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1045" y1="214" x2="1045" y2="264" stroke="#4a7c9e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── LAYER 2: INGESTION ── -->
  <rect x="30" y="268" width="1140" height="130" rx="4" fill="#041208" stroke="#166534" stroke-width="1.5"/>
  <text x="46" y="286" fill="#22c55e" font-size="11" font-weight="bold" letter-spacing="3">INGESTION + QUERY LAYER</text>

  <!-- GDELT Query Builder -->
  <rect x="46" y="296" width="340" height="88" rx="3" fill="#041410" stroke="#166534" stroke-width="1"/>
  <text x="216" y="313" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">GDELT SEMANTIC QUERY BUILDER</text>
  <text x="216" y="328" text-anchor="middle" fill="#4ade80" font-size="8">60+ topic → GDELT query mappings</text>
  <text x="216" y="340" text-anchor="middle" fill="#4ade80" font-size="8">Overlay ID-based topic extraction</text>
  <text x="216" y="352" text-anchor="middle" fill="#4ade80" font-size="8">Heading text fallback detection</text>
  <text x="216" y="364" text-anchor="middle" fill="#64748b" font-size="8">nuclear · cyber · maritime · terror · sanctions · conflict · space · SIGINT</text>
  <text x="216" y="376" text-anchor="middle" fill="#166534" font-size="8">_ULF_TOPICS{} + _ulfGetTopic(overlay)</text>

  <!-- Async Fetch Engine -->
  <rect x="406" y="296" width="340" height="88" rx="3" fill="#041410" stroke="#166534" stroke-width="1"/>
  <text x="576" y="313" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">ASYNC FETCH ENGINE</text>
  <text x="576" y="328" text-anchor="middle" fill="#4ade80" font-size="8">AbortSignal.timeout(12000) per request</text>
  <text x="576" y="340" text-anchor="middle" fill="#4ade80" font-size="8">Multi-tier timespan fallback: 24H → 72H → 168H</text>
  <text x="576" y="352" text-anchor="middle" fill="#4ade80" font-size="8">Broader query retry on empty result</text>
  <text x="576" y="364" text-anchor="middle" fill="#4ade80" font-size="8">Graceful degradation: "temporarily offline"</text>
  <text x="576" y="376" text-anchor="middle" fill="#166534" font-size="8">_gdeltFetch() · _ulfRefreshFeed() · AbortController</text>

  <!-- Universal Live Feed Injector -->
  <rect x="766" y="296" width="378" height="88" rx="3" fill="#041410" stroke="#166534" stroke-width="1"/>
  <text x="955" y="313" text-anchor="middle" fill="#86efac" font-size="10" font-weight="bold">UNIVERSAL LIVE FEED INJECTOR</text>
  <text x="955" y="328" text-anchor="middle" fill="#4ade80" font-size="8">Global click interceptor (capture:true)</text>
  <text x="955" y="340" text-anchor="middle" fill="#4ade80" font-size="8">Auto-injects live articles into ALL 143 overlays</text>
  <text x="955" y="352" text-anchor="middle" fill="#4ade80" font-size="8">Pulsing "LIVE" indicator + refresh button</text>
  <text x="955" y="364" text-anchor="middle" fill="#4ade80" font-size="8">Zero overlay modifications required</text>
  <text x="955" y="376" text-anchor="middle" fill="#166534" font-size="8">_ulfInjectFeed() · document.addEventListener capture</text>

  <!-- Arrows: Ingestion → Processing -->
  <line x1="216" y1="384" x2="216" y2="434" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="576" y1="384" x2="576" y2="434" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="955" y1="384" x2="955" y2="434" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ── LAYER 3: PROCESSING ── -->
  <rect x="30" y="438" width="1140" height="100" rx="4" fill="#0d0418" stroke="#6b21a8" stroke-width="1.5"/>
  <text x="46" y="456" fill="#a855f7" font-size="11" font-weight="bold" letter-spacing="3">PROCESSING + RELEVANCE RANKING</text>

  <rect x="46" y="466" width="340" height="60" rx="3" fill="#100624" stroke="#6b21a8" stroke-width="1"/>
  <text x="216" y="483" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">TOPIC RELEVANCE MAPPING</text>
  <text x="216" y="498" text-anchor="middle" fill="#a78bfa" font-size="8">Overlay ID → geopolitical topic → GDELT query</text>
  <text x="216" y="512" text-anchor="middle" fill="#a78bfa" font-size="8">Domain-specific keyword injection</text>

  <rect x="406" y="466" width="340" height="60" rx="3" fill="#100624" stroke="#6b21a8" stroke-width="1"/>
  <text x="576" y="483" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">DEDUPLICATION + SORTING</text>
  <text x="576" y="498" text-anchor="middle" fill="#a78bfa" font-size="8">Timestamp-based chronological sorting</text>
  <text x="576" y="512" text-anchor="middle" fill="#a78bfa" font-size="8">Source domain attribution and labeling</text>

  <rect x="766" y="466" width="378" height="60" rx="3" fill="#100624" stroke="#6b21a8" stroke-width="1"/>
  <text x="955" y="483" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">LIVE STATUS MONITORING</text>
  <text x="955" y="498" text-anchor="middle" fill="#a78bfa" font-size="8">Per-source health indicators (GDELT · ReliefWeb · USGS · FIRMS · AIS)</text>
  <text x="955" y="512" text-anchor="middle" fill="#a78bfa" font-size="8">Real-time status bar with latency display</text>

  <!-- Arrows: Processing → Display -->
  <line x1="216" y1="526" x2="216" y2="574" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="576" y1="526" x2="576" y2="574" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="955" y1="526" x2="955" y2="574" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ── LAYER 4: DISPLAY ── -->
