  <text x="46" y="596" fill="#ef4444" font-size="11" font-weight="bold" letter-spacing="3">INTELLIGENCE DISPLAY LAYER</text>

  <!-- Globe -->
  <rect x="46" y="606" width="200" height="108" rx="3" fill="#1a0206" stroke="#991b1b" stroke-width="1"/>
  <text x="146" y="624" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">CANVAS 2D GLOBE</text>
  <text x="146" y="639" text-anchor="middle" fill="#f87171" font-size="8">Country threat-level coloring</text>
  <text x="146" y="651" text-anchor="middle" fill="#f87171" font-size="8">Live hotspot pins + animation</text>
  <text x="146" y="663" text-anchor="middle" fill="#f87171" font-size="8">Custom project(lat,lng) renderer</text>
  <text x="146" y="675" text-anchor="middle" fill="#f87171" font-size="8">Click-to-drill country profiles</text>
  <text x="146" y="687" text-anchor="middle" fill="#64748b" font-size="8">195 countries · all threat types</text>
  <text x="146" y="700" text-anchor="middle" fill="#991b1b" font-size="8">requestAnimationFrame loop</text>

  <!-- 143 Overlays -->
