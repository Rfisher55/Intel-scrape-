  <text x="368" y="624" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">143 INTEL OVERLAYS</text>
  <text x="368" y="639" text-anchor="middle" fill="#f87171" font-size="8">17 column layout · 9 per column</text>
  <text x="368" y="651" text-anchor="middle" fill="#f87171" font-size="8">Nuclear · Cyber · Maritime · Terror</text>
  <text x="368" y="663" text-anchor="middle" fill="#f87171" font-size="8">Sanctions · Conflict · Space · SIGINT</text>
  <text x="368" y="675" text-anchor="middle" fill="#f87171" font-size="8">Humanitarian · UNSC · IC Brief</text>
  <text x="368" y="687" text-anchor="middle" fill="#f87171" font-size="8">Each with injected live GDELT feed</text>
  <text x="368" y="700" text-anchor="middle" fill="#991b1b" font-size="8">SITREP · Country Files · Key Leaders</text>

  <!-- Country Intel -->
  <rect x="490" y="606" width="200" height="108" rx="3" fill="#1a0206" stroke="#991b1b" stroke-width="1"/>
  <text x="590" y="624" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">COUNTRY INTEL FILES</text>
  <text x="590" y="639" text-anchor="middle" fill="#f87171" font-size="8">195 country profiles</text>
  <text x="590" y="651" text-anchor="middle" fill="#f87171" font-size="8">Government · military · economy</text>
  <text x="590" y="663" text-anchor="middle" fill="#f87171" font-size="8">Nuclear status · alliance mapping</text>
  <text x="590" y="675" text-anchor="middle" fill="#f87171" font-size="8">CIA-style analyst notes</text>
  <text x="590" y="687" text-anchor="middle" fill="#f87171" font-size="8">Live GDELT feed per country</text>
  <text x="590" y="700" text-anchor="middle" fill="#991b1b" font-size="8">Real-time diplo + threat tab</text>

  <!-- Live News Ticker -->
  <rect x="702" y="606" width="200" height="108" rx="3" fill="#1a0206" stroke="#991b1b" stroke-width="1"/>
  <text x="802" y="624" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">LIVE NEWS TICKER</text>
  <text x="802" y="639" text-anchor="middle" fill="#f87171" font-size="8">Scrolling GDELT headlines</text>
  <text x="802" y="651" text-anchor="middle" fill="#f87171" font-size="8">Auto-refresh every 5 minutes</text>
  <text x="802" y="663" text-anchor="middle" fill="#f87171" font-size="8">Topic-filtered by severity</text>
  <text x="802" y="675" text-anchor="middle" fill="#f87171" font-size="8">Click-to-open source article</text>
  <text x="802" y="687" text-anchor="middle" fill="#f87171" font-size="8">Priority: conflict · nuclear · cyber</text>
  <text x="802" y="700" text-anchor="middle" fill="#991b1b" font-size="8">CSS marquee + JS feed injection</text>

  <!-- Mobile UI -->
  <rect x="914" y="606" width="230" height="108" rx="3" fill="#1a0206" stroke="#991b1b" stroke-width="1"/>
  <text x="1029" y="624" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">RESPONSIVE MOBILE UI</text>
  <text x="1029" y="639" text-anchor="middle" fill="#f87171" font-size="8">iPhone-first INTEL MENU</text>
  <text x="1029" y="651" text-anchor="middle" fill="#f87171" font-size="8">55+ categories · touch-optimized</text>
  <text x="1029" y="663" text-anchor="middle" fill="#f87171" font-size="8">≤1024px: column buttons hidden</text>
  <text x="1029" y="675" text-anchor="middle" fill="#f87171" font-size="8">Full-screen overlay panels</text>
  <text x="1029" y="687" text-anchor="middle" fill="#f87171" font-size="8">44px min touch targets (WCAG)</text>
  <text x="1029" y="700" text-anchor="middle" fill="#991b1b" font-size="8">@media (max-width:1024px)</text>

  <!-- Footer -->
  <text x="600" y="732" text-anchor="middle" fill="#1e3a5f" font-size="9" letter-spacing="2">OPEN SOURCE · SINGLE-FILE HTML/CSS/JS · ~39,000 LINES · ALL PUBLIC APIS · NO BACKEND REQUIRED</text>
</svg>
